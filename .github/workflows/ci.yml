name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run ruff (lint)
        run: |
          ruff check src tests

      - name: Run ruff format check
        run: |
          ruff format --check src tests

      - name: Run pytest
        run: |
          pytest -v --tb=short

      - name: Check imports
        run: |
          python -c "import securedrop_lite; import securedrop_lite.crypto; import securedrop_lite.server; print('All imports OK')"

  build-docker:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t securedrop-lite:latest .

      - name: Test Docker image runs
        run: |
          docker run --rm -d -p 8080:8080 --name test-securedrop securedrop-lite:latest
          sleep 5
          curl -f http://localhost:8080/health
          docker stop test-securedrop